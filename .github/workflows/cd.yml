# GitHub Actions 화면에 표시되는 CD workflow 이름입니다.
name: CD

# main에 merge되면 release PR title/body의 vX.Y.Z에 해당하는 ECR image를 배포합니다.
# workflow_dispatch는 이미 ECR에 존재하는 image tag를 수동 재배포하기 위한 진입점입니다.
on:
  # main push는 release PR merge 이후 자동 배포를 담당합니다.
  push:
    branches:
      - main
    paths-ignore:
      # GitOps 배포 commit이 다시 CD를 실행하는 루프를 막습니다.
      - 'k8s/helm/community-backend/values.yaml'
  # 수동 실행은 rollback 또는 재배포에 사용합니다.
  workflow_dispatch:
    inputs:
      image_tag:
        # ECR에 이미 push되어 있는 tag만 입력해야 합니다.
        description: '이미 ECR에 존재하는 image tag를 재배포한다. 예: v1.0.1'
        required: true
        type: string

# workflow 기본 권한입니다.
# 실제 배포 job에서는 tag push와 PR 조회 때문에 job-level 권한을 더 넓게 다시 선언합니다.
permissions:
  contents: read

# CD 전체에서 사용하는 배포 환경 변수입니다.
env:
  # AWS API 호출 리전입니다.
  AWS_REGION: ${{ vars.AWS_REGION }}

  # 배포할 이미지를 조회할 ECR registry입니다.
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

  # 배포할 백엔드 ECR repository입니다.
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  # release image를 Kubernetes Deployment에 배포하는 단일 job입니다.
  release-and-deploy:
    name: Deploy release image
    runs-on: ubuntu-latest

    # push와 workflow_dispatch만 처리합니다.
    # 현재 on 조건상 항상 true에 가깝지만, job 의도를 명시합니다.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    # production environment를 사용해 승인/secret 보호 규칙을 적용할 수 있게 합니다.
    environment: production

    # contents: write는 Git release tag push에 필요합니다.
    # id-token: write는 AWS OIDC 인증에 필요합니다.
    # pull-requests: read는 merge commit과 연결된 PR 정보를 조회하는 데 필요합니다.
    permissions:
      contents: write
      id-token: write
      pull-requests: read

    steps:
      # main push의 merge commit과 tag 상태를 확인해야 하므로 전체 history를 checkout합니다.
      - name: Checkout main commit
        uses: actions/checkout@v7
        with:
          # tag 존재 여부와 tag 대상 commit 확인을 위해 shallow clone을 피합니다.
          fetch-depth: 0

      # main에 merge된 PR title에서 vMAJOR.MINOR.PATCH를 찾아 release image tag로 사용합니다.
      # 예: PR title "release v1.0.1" -> Git tag v1.0.1 + ECR image tag v1.0.1
      - name: Resolve image tag from merged PR
        # 수동 재배포는 inputs.image_tag를 쓰므로 push 이벤트에서만 이 step을 실행합니다.
        if: github.event_name == 'push'
        id: version
        shell: bash
        env:
          # GitHub API 인증용 token입니다. pull-requests: read 권한이 필요합니다.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # shell 오류, unset 변수, pipeline 실패를 즉시 감지합니다.
          set -euo pipefail

          # 현재 main push commit과 연결된 PR 목록을 조회하는 GitHub API URL입니다.
          pulls_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls"
          # merge commit에 연결된 PR 목록을 가져옵니다.
          pulls_json="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${pulls_url}")"

          # main에 merge된 PR 중 가장 마지막 PR title을 선택합니다.
          # 의도: PR title의 version을 배포 version의 단일 출처로 사용합니다.
          pr_title="$(jq -r '
            [
              .[]
              | select(
                  .base.ref == "main"
                  and .merged_at != null
                )
            ]
            | sort_by(.number)
            | last
            | if . == null then "" else .title end
          ' <<< "${pulls_json}")"

          # PR title에서 vX.Y.Z 형태의 tag를 추출합니다.
          image_tag="$(printf '%s\n' "${pr_title}" | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"

          # 연결된 PR이 없으면 배포 대상이 아니므로 실패가 아니라 skip으로 처리합니다.
          if [ -z "${pr_title}" ]; then
            echo "No merged PR found for this push. Skipping deployment."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # version이 없으면 일반 main merge로 판단하고 배포를 skip합니다.
          if [ -z "${image_tag}" ]; then
            echo "Merged PR title does not contain release version. Skipping deployment."
            echo "PR title: ${pr_title}"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 이미 같은 tag가 존재하면 같은 commit을 가리키는지 확인합니다.
          # 의도: 동일 version tag를 다른 commit에 재사용해 배포 추적성이 깨지는 것을 막습니다.
          if git rev-parse -q --verify "refs/tags/${image_tag}" >/dev/null; then
            existing_tag_sha="$(git rev-list -n 1 "refs/tags/${image_tag}")"

            if [ "${existing_tag_sha}" != "${GITHUB_SHA}" ]; then
              echo "Git tag ${image_tag} already points to ${existing_tag_sha}. Use a new release version."
              exit 1
            fi

            echo "Git tag ${image_tag} already points to this commit. Continuing redeploy."
          fi

          # 이후 step 조건과 image URI 생성에 사용합니다.
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "Release image tag: ${image_tag}"

      # AWS OIDC 인증을 설정합니다.
      # push에서는 release PR일 때만, 수동 실행에서는 항상 필요합니다.
      - name: Configure AWS credentials
        if: ${{ github.event_name == 'workflow_dispatch' || steps.version.outputs.should_deploy == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 최종 배포할 image tag와 image URI를 결정합니다.
      - name: Resolve image tag
        if: ${{ github.event_name == 'workflow_dispatch' || steps.version.outputs.should_deploy == 'true' }}
        id: image
        shell: bash
        run: |
          set -euo pipefail

          # 수동 실행이면 사용자가 입력한 tag를 사용합니다.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            image_tag="${{ inputs.image_tag }}"
          # main push면 release PR에서 추출한 tag를 사용합니다.
          elif [ "${{ github.event_name }}" = "push" ]; then
            image_tag="${{ steps.version.outputs.image_tag }}"
          else
            image_tag=""
          fi

          # 방어 코드: tag를 결정하지 못하면 배포할 수 없습니다.
          if [ -z "${image_tag}" ]; then
            echo "No image tag resolved."
            exit 1
          fi

          # ECR 검증과 로그 출력에 사용할 full image URI입니다.
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${image_tag}"

          # 이후 ECR 검증과 Helm values 갱신에서 재사용합니다.
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${image_uri}" >> "$GITHUB_OUTPUT"

          echo "Deploy image: ${image_uri}"

      # 배포 전에 ECR에 해당 image tag가 실제 존재하는지 확인합니다.
      # 의도: ArgoCD가 rollout하기 전에 image tag 누락을 GitHub Actions에서 먼저 잡습니다.
      - name: Verify image exists in ECR
        if: ${{ github.event_name == 'workflow_dispatch' || steps.version.outputs.should_deploy == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${{ steps.image.outputs.image_tag }}" \
            --region "${AWS_REGION}" >/dev/null

      # Helm values의 image tag를 갱신합니다.
      # 의도: ArgoCD가 Git에 선언된 desired state를 보고 배포하게 합니다.
      - name: Update Helm image tag
        if: ${{ github.event_name == 'workflow_dispatch' || steps.version.outputs.should_deploy == 'true' }}
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          set -euo pipefail

          values_file="k8s/helm/community-backend/values.yaml"

          sed -i -E "s/^  tag: .*/  tag: ${IMAGE_TAG}/" "${values_file}"
          git diff -- "${values_file}"

      # 변경된 Helm values를 main에 commit/push합니다.
      # 의도: ArgoCD가 Git 변경을 감지해서 배포하도록 합니다.
      - name: Commit and push Helm values
        if: ${{ github.event_name == 'workflow_dispatch' || steps.version.outputs.should_deploy == 'true' }}
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          set -euo pipefail

          values_file="k8s/helm/community-backend/values.yaml"

          if git diff --quiet -- "${values_file}"; then
            echo "${values_file} already uses ${IMAGE_TAG}. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${values_file}"
          git commit -m "chore: deploy backend ${IMAGE_TAG} [skip ci]"
          git push origin HEAD:main

      # 배포 성공 후 Git tag를 생성합니다.
      # 의도: main commit, ECR image tag, release version을 같은 vX.Y.Z로 묶어 추적성을 확보합니다.
      - name: Push Git release tag
        if: github.event_name == 'push' && steps.version.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # 같은 tag가 이미 있으면 재배포로 보고 tag push를 생략합니다.
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.image_tag }}" >/dev/null; then
            echo "Git tag ${{ steps.version.outputs.image_tag }} already exists. Skipping tag push."
            exit 0
          fi

          # GitHub Actions bot identity로 tag를 생성합니다.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 현재 main merge commit에 release tag를 붙이고 origin으로 push합니다.
          git tag "${{ steps.version.outputs.image_tag }}" "${GITHUB_SHA}"
          git push origin "${{ steps.version.outputs.image_tag }}"
