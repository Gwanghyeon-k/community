apiVersion: v1
kind: ConfigMap
metadata:
  name: community-backend-config
  namespace: community
  labels:
    app: community-backend
    tier: backend
data:
  # 현재 실행할 Spring profile이다.
  # profile은 환경별로 달라질 수 있고 Secret이 아니므로 ConfigMap에서 관리한다.
  SPRING_PROFILES_ACTIVE: dev
  # Tomcat thread pool 기본 튜닝값이다.
  # application-dev.yml에도 기본값이 있으므로, 운영 중 Kubernetes에서 override하고 싶을 때만 ConfigMap 값이 의미를 가진다.
  TOMCAT_MAX_THREADS: "20"
  TOMCAT_MIN_SPARE_THREADS: "5"
  # HikariCP connection pool 기본 튜닝값이다.
  # DB 성능과 Pod replica 수에 따라 조정될 수 있지만 credential이 아니므로 Secret이 아니라 ConfigMap에 둔다.
  HIKARI_MAX_POOL_SIZE: "10"
  HIKARI_MIN_IDLE: "5"
  # AWS region은 공개 가능한 환경 설정이며 S3 client와 ECR 관련 동작에서 리전 기준으로 사용한다.
  AWS_REGION: ap-northeast-2
