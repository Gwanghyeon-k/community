apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-backend
  namespace: community
  labels:
    app: community-backend
    tier: backend
spec:
  # 평상시 백엔드 Pod를 2개 유지한다.
  # 현재 worker node가 2대이므로 정상 상태에서는 각 worker에 Pod 1개씩 배치하는 것이 목표다.
  # 이 값은 원하는 상시 replica 수이며, rolling update 중 일시적으로 늘어나는 최대 Pod 수는 아래 maxSurge 설정까지 같이 봐야 한다.
  replicas: 2
  # 이전 ReplicaSet을 최대 3개까지 보관한다.
  # image 업데이트 후 문제가 생기면 kubectl rollout undo로 직전 버전으로 되돌릴 수 있게 하기 위한 값이다.
  # 너무 크게 잡으면 오래된 ReplicaSet 이력이 불필요하게 쌓이고, 너무 작게 잡으면 rollback 여지가 줄어든다.
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # rolling update 중 desired replicas보다 Pod를 최대 1개 더 만들 수 있다.
      # replicas가 2이므로 배포 중 순간적으로 최대 3개 Pod까지 생성될 수 있다.
      # 새 Pod가 readinessProbe를 통과한 뒤 기존 Pod를 줄일 수 있어 배포 중 가용성을 높인다.
      maxSurge: 1
      # rolling update 중 사용 가능한 Pod 수를 의도적으로 줄이지 않는다.
      # 기존 ready Pod를 먼저 내리지 않고 새 Pod가 준비된 뒤 교체하므로 무중단 배포에 유리하다.
      maxUnavailable: 0
  # Deployment가 어떤 Pod를 자기 관리 대상으로 볼지 결정한다.
  # template.metadata.labels의 app 값과 반드시 일치해야 하며, 이미 생성된 Deployment에서는 selector 변경이 제한된다.
  selector:
    matchLabels:
      app: community-backend
  template:
    metadata:
      labels:
        app: community-backend
        tier: backend
    spec:
      # ECR private image를 pull하기 위한 docker-registry Secret이다.
      # 이 Secret이 없거나 만료되면 Pod는 ErrImagePull 또는 ImagePullBackOff 상태가 된다.
      imagePullSecrets:
        - name: ecr-registry-secret
      # 백엔드 workload를 master node가 아니라 worker node에만 배치한다.
      # master node는 control-plane 역할에 집중시키고, 애플리케이션 부하는 worker node가 담당하게 하기 위한 설정이다.
      nodeSelector:
        node-role: worker
      # 같은 Deployment의 Pod가 하나의 worker에 몰리지 않도록 분산 배치를 요청한다.
      # kubernetes.io/hostname 기준이므로 가능한 경우 서로 다른 node에 Pod를 나눠 배치한다.
      # replicas가 2이고 worker가 2대이면 정상 상태에서 worker마다 Pod 1개씩 뜨는 구성이 된다.
      topologySpreadConstraints:
        # node별 Pod 수 차이가 1개를 넘지 않도록 한다.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # node 장애나 자원 부족 상황에서 분산 조건을 완벽히 만족하지 못해도 스케줄링 자체는 허용한다.
          # 운영 안정성은 유지하되, 일시적 상황 때문에 Pod 생성이 완전히 막히는 것을 피하기 위한 선택이다.
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: community-backend
      containers:
        - name: backend
          image: 418295697072.dkr.ecr.ap-northeast-2.amazonaws.com/amumal-community-backend:v0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          # ConfigMap의 non-secret 값을 환경 변수로 주입한다.
          # profile, region, pool 튜닝값처럼 노출되어도 치명적이지 않은 설정만 이 경로로 전달한다.
          envFrom:
            - configMapRef:
                name: community-backend-config
          env:
            # Secret은 envFrom으로 직접 환경 변수에 노출하지 않고 파일 volume으로 mount한다.
            # Spring Boot configtree import를 사용하면 /etc/secrets/community-backend/DB_URL 같은 파일이 DB_URL property로 읽힌다.
            # optional을 붙여 로컬/테스트처럼 Secret mount가 없는 환경에서도 애플리케이션 설정 로딩 자체는 막히지 않게 한다.
            - name: SPRING_CONFIG_IMPORT
              value: optional:configtree:/etc/secrets/community-backend/
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            # Spring Boot 기동, DB/Redis 연결, application context 초기화를 기다리기 위해 첫 health check를 30초 늦춘다.
            # 너무 짧으면 정상 기동 중인 Pod를 준비 실패로 판단할 수 있다.
            initialDelaySeconds: 30
            # readiness는 10초마다 확인한다.
            # 빠른 트래픽 투입/제외와 불필요한 health 요청 증가 사이의 균형을 맞춘 값이다.
            periodSeconds: 10
            # health endpoint가 3초 안에 응답하지 않으면 해당 probe는 실패로 본다.
            # 내부 health check가 오래 걸리는 상태는 트래픽을 받기 부적절하다고 판단한다.
            timeoutSeconds: 3
            # readiness는 6번 연속 실패해야 준비되지 않은 Pod로 본다.
            # 10초 주기 기준 최대 약 60초 동안 일시적인 DB/Redis 지연이나 cold start를 허용한다.
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            # liveness는 readiness보다 더 늦게 시작한다.
            # 초기 기동이 느린 상황을 애플리케이션 장애로 오판해 컨테이너를 재시작하는 일을 줄이기 위한 값이다.
            initialDelaySeconds: 40
            # liveness는 20초마다 확인한다.
            # 재시작 판단은 readiness보다 보수적으로 가져가서 일시적인 지연 때문에 재시작이 반복되지 않게 한다.
            periodSeconds: 20
            # 3초 안에 응답하지 않으면 liveness probe 1회 실패로 본다.
            timeoutSeconds: 3
            # 3번 연속 실패하면 kubelet이 컨테이너를 재시작한다.
            # 20초 주기 기준 약 60초 이상 비정상 상태가 지속될 때 복구를 시도한다.
            failureThreshold: 3
          volumeMounts:
            # community-backend-secret을 컨테이너 안의 파일 디렉터리로 mount한다.
            # Secret key 하나가 파일 하나가 되며, readOnly로 둬서 애플리케이션이 Secret 파일을 수정하지 못하게 한다.
            - name: backend-secret
              mountPath: /etc/secrets/community-backend
              readOnly: true
            # 애플리케이션의 local image storage 경로를 보장하기 위한 임시 디렉터리다.
            # 업로드 이미지의 durable storage는 S3 기준이므로, 이 경로는 Pod 생명주기 동안만 유지되는 임시 저장소로 본다.
            - name: backend-images
              mountPath: /app/image
      volumes:
        # Kubernetes Secret 리소스를 Pod volume으로 연결한다.
        # 실제 Secret 값은 community-backend-secret에 있고, 이 Deployment는 Secret 이름만 참조한다.
        - name: backend-secret
          secret:
            secretName: community-backend-secret
        # emptyDir은 Pod가 특정 node에 할당될 때 빈 디렉터리로 생성된다.
        # Pod가 삭제되면 같이 삭제되므로 PV/PVC처럼 영속성을 제공하지 않는다.
        - name: backend-images
          emptyDir: {}
